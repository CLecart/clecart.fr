# Weekly update proposals, one pull request per ecosystem and week. Each one
# runs the Check workflow before anything can be merged.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tooling:
        patterns: ["*"]

  # Moves the commit SHA each action is pinned to, and its version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Moves the nginx base image's tag and digest in the Dockerfile, within its
  # release branch only. nginx numbers its stable branches with an even minor
  # (1.30) and its mainline with an odd one (1.31): Dependabot cannot tell them
  # apart, so it proposes patches alone, and a new stable branch is a
  # deliberate bump.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: nginxinc/nginx-unprivileged
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
