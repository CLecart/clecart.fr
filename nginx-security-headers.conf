# nginx only inherits add_header from an outer level when the current level
# declares none of its own. Every location here sets Cache-Control, so each one
# must include this file explicitly or it serves no security header at all.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
# The browser XSS auditor is gone from every engine, and where it remained it
# could be abused to blank parts of a page: OWASP's advice is to disable it.
add_header X-XSS-Protection "0" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-w7cn94Y+/0Pp7IFYZNHIQ4PPivuVZGKRrnULb1rAOS8=' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; frame-src https://www.google.com/recaptcha/ https://recaptcha.google.com/recaptcha/; connect-src 'self' https://api.emailjs.com https://www.google.com/recaptcha/; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;
