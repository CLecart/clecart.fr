# Neither extension is in nginx's mime.types, so both went out as
# application/octet-stream, which nosniff then forbids the browser to read as
# captions or as a manifest. This block sits outside server on purpose: at the
# http level it extends the stock map, inside server it would replace it.
types {
    text/vtt                  vtt;
    application/manifest+json webmanifest;
}

server {
    listen       80;
    server_name  localhost;
    root   /usr/share/nginx/html;
    index  index.html;

    include /etc/nginx/security-headers.conf;

    gzip on;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript text/vtt application/javascript application/x-javascript application/xml application/json application/manifest+json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    error_page 404 /404.html;

    # No URL here carries a version, so HTML, CSS, JS, the manifest and the
    # icon sprite are revalidated on every use: unchanged, they cost a 304;
    # changed, a returning visitor gets the new deployment on the next load.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # Media is not bound to the markup the way CSS and JS are: a picture a week
    # stale breaks nothing. SVG stays out, since pages reference the sprite's
    # symbols by id.
    location ~* \.(?:avif|webp|png|jpe?g|gif|ico|woff2?|mp4|webm)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # The release number is in the file name: a new version is a new URL.
    location ~ ^/js/vendor/[^/]+-\d+\.\d+\.\d+\.min\.js$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /cv {
        include /etc/nginx/security-headers.conf;
        alias /usr/share/nginx/html/assets/documents/CV_Christophe_Lecart.pdf;
        # nginx types a response by its URI, and /cv has no extension to map.
        default_type application/pdf;
        add_header Content-Disposition 'attachment; filename="CV_Christophe_Lecart.pdf"';
        add_header Cache-Control "no-cache";
    }
}
